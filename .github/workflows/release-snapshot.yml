name: Verificar e publicar snapshot

on:
  push:
    tags:
      - "dados-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag assinada no formato dados-AAAA-MM-DD.N
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-snapshot-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Assinatura, dados, testes e release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: snapshot-release

    steps:
      - name: Obter exatamente a tag solicitada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Exigir GitHub CLI com verificador corrigido
        run: |
          set -euo pipefail
          installed_version="$(gh --version | awk 'NR == 1 { print $3 }')"
          dpkg --compare-versions "$installed_version" ge 2.97.0 || { echo "GitHub CLI $installed_version é vulnerável; requer 2.97.0 ou superior." >&2; exit 1; }
          echo "GitHub CLI $installed_version apto para verificar proveniência."

      - name: Instalar dependências reproduzíveis
        run: npm ci --ignore-scripts

      - name: Auditar dependências e cadeia de build
        run: npm audit --audit-level=high

      - name: Verificar tags SSH e vínculo com a metodologia
        id: release
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          [[ "$tag" =~ ^dados-([0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+)$ ]] || { echo "Tag inválida: $tag" >&2; exit 1; }
          snapshot="${BASH_REMATCH[1]}"
          git config gpg.ssh.allowedSignersFile "$PWD/.github/release-signers"
          git verify-tag metodologia-v1.0
          git verify-tag "$tag"
          [[ "$(git rev-parse "$tag^{commit}")" == "$(git rev-parse HEAD)" ]] || { echo "Checkout não corresponde à tag." >&2; exit 1; }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$tag^{commit}" refs/remotes/origin/main || { echo "A tag de dados não pertence à história protegida de main." >&2; exit 1; }

          methodology_commit="$(node --input-type=module -e 'import { readYaml } from "./scripts/lib/io.mjs"; const m = await readYaml("./content/releases/metodologia.yaml"); process.stdout.write(m.commit)')"
          [[ "$methodology_commit" == "$(git rev-parse metodologia-v1.0^{commit})" ]] || { echo "Snapshot não aponta para a tag metodológica." >&2; exit 1; }
          actual_snapshot="$(node -e 'const m=require("./public/dados/latest/manifest.json"); process.stdout.write(m.id)')"
          [[ "$actual_snapshot" == "$snapshot" ]] || { echo "Manifesto $actual_snapshot não corresponde à tag $tag." >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"

      - name: Validar, construir e testar o artefato marcado
        run: |
          set -euo pipefail
          node scripts/data/validate.mjs
          node scripts/data/regression-checks.mjs
          node scripts/data/build-snapshot.mjs --check
          npm run lint
          npm run build
          node --test tests/*.test.mjs

      - name: Recuperar release existente e validar imutabilidade
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ steps.release.outputs.tag }}
          SNAPSHOT: ${{ steps.release.outputs.snapshot }}
        run: |
          set -euo pipefail
          archive="planos-de-governo-sites-${SNAPSHOT}.tar.gz"
          handoff="sites-handoff-${SNAPSHOT}.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            [[ "$(gh release view "$TAG" --json isImmutable --jq '.isImmutable')" == "true" ]] || { echo "A release existente não é imutável." >&2; exit 1; }
            gh release download "$TAG" --dir "$PWD" \
              --pattern "$archive" --pattern "$archive.sha256" --pattern "$handoff"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            [[ "$EVENT_NAME" == "push" ]] || { echo "A primeira publicação deve ser disparada pela tag assinada." >&2; exit 1; }
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Empacotar bundle compatível e criar handoff verificável
        if: steps.published.outputs.exists != 'true'
        env:
          SNAPSHOT: ${{ steps.release.outputs.snapshot }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          archive="planos-de-governo-sites-${SNAPSHOT}.tar.gz"
          handoff="sites-handoff-${SNAPSHOT}.json"
          bash .github/scripts/package-site.sh "$PWD" "$archive"
          sha256sum "$archive" > "$archive.sha256"
          node .github/scripts/sites-handoff.mjs create \
            --root "$PWD" --tag "$TAG" --commit "$(git rev-parse HEAD)" --archive "$archive" > "$handoff"
          node .github/scripts/sites-handoff.mjs verify \
            --root "$PWD" --handoff "$handoff" --expected-commit "$(git rev-parse HEAD)"

      - name: Atestar proveniência do bundle no workflow produtor
        if: steps.published.outputs.exists != 'true'
        uses: actions/attest@v4
        with:
          subject-path: ${{ github.workspace }}/planos-de-governo-sites-${{ steps.release.outputs.snapshot }}.tar.gz

      - name: Verificar proveniência do bundle produtor
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          SNAPSHOT: ${{ steps.release.outputs.snapshot }}
        run: |
          set -euo pipefail
          archive="planos-de-governo-sites-${SNAPSHOT}.tar.gz"
          verified=false
          for attempt in 1 2 3 4 5 6; do
            if gh attestation verify "$archive" \
              --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release-snapshot.yml" \
              --source-ref "refs/tags/$TAG" \
              --source-digest "$(git rev-parse HEAD)" \
              --deny-self-hosted-runners; then
              verified=true
              break
            fi
            sleep 5
          done
          [[ "$verified" == "true" ]] || { echo "A proveniência do bundle não corresponde ao workflow, tag e commit esperados." >&2; exit 1; }

      - name: Criar release pública sem alterar a tag assinada
        if: steps.published.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          SNAPSHOT: ${{ steps.release.outputs.snapshot }}
        run: |
          set -euo pipefail
          archive="planos-de-governo-sites-${SNAPSHOT}.tar.gz"
          handoff="sites-handoff-${SNAPSHOT}.json"
          gh release create "$TAG" "$archive" "$archive.sha256" "$handoff" \
            --verify-tag \
            --title "Dados $SNAPSHOT" \
            --notes "Snapshot atômico $SNAPSHOT, validado contra a metodologia 1.0. O bundle compatível e o handoff identificam o commit exato para implantação autorizada no Sites."

      - name: Verificar release imutável e seus três assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          SNAPSHOT: ${{ steps.release.outputs.snapshot }}
          EXISTING: ${{ steps.published.outputs.exists }}
        run: |
          set -euo pipefail
          archive="planos-de-governo-sites-${SNAPSHOT}.tar.gz"
          handoff="sites-handoff-${SNAPSHOT}.json"
          [[ "$(gh release view "$TAG" --json isImmutable --jq '.isImmutable')" == "true" ]] || { echo "A release publicada não está protegida por imutabilidade." >&2; exit 1; }

          verified=false
          for attempt in 1 2 3 4 5 6; do
            if gh release verify "$TAG"; then
              verified=true
              break
            fi
            sleep 5
          done
          [[ "$verified" == "true" ]] || { echo "A atestação da release não ficou disponível." >&2; exit 1; }
          for asset in "$archive" "$archive.sha256" "$handoff"; do
            gh release verify-asset "$TAG" "$asset"
          done
          node .github/scripts/verify-release-assets.mjs \
            --root "$PWD" \
            --archive "$archive" \
            --checksum "$archive.sha256" \
            --handoff "$handoff" \
            --expected-commit "$(git rev-parse HEAD)"
          if [[ "$EXISTING" == "true" ]]; then
            echo "A release $TAG já continha assets atestados; reexecução concluída sem mutação." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar handoff validado para operador do Sites
        uses: actions/upload-artifact@v4
        with:
          name: sites-${{ steps.release.outputs.snapshot }}
          path: |
            planos-de-governo-sites-${{ steps.release.outputs.snapshot }}.tar.gz
            planos-de-governo-sites-${{ steps.release.outputs.snapshot }}.tar.gz.sha256
            sites-handoff-${{ steps.release.outputs.snapshot }}.json
          if-no-files-found: error
          retention-days: 30
