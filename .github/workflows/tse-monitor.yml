name: Monitorar fontes do TSE

on:
  schedule:
    # As três agendas são estáticas; a issue de estado decide qual executa.
    - cron: "17 * * * *"
    - cron: "37 06 * * *"
    - cron: "53 07 * * 1"
  workflow_dispatch:
    inputs:
      cadence:
        description: Cadência desta verificação manual; automatic preserva o estado atual
        required: true
        default: automatic
        type: choice
        options:
          - automatic
          - hourly
          - daily
          - weekly

permissions:
  contents: read
  issues: write

concurrency:
  group: tse-source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Verificar metadados e documentos
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Derivar restrições do snapshot atual
        id: context
        run: |
          set -euo pipefail
          node .github/scripts/tse-monitor-state.mjs context \
            --manifest public/dados/latest/manifest.json \
            --candidacies public/dados/latest/candidaturas.json >> "$GITHUB_OUTPUT"

      - name: Recuperar estado auditável e selecionar a agenda
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_CADENCE: ${{ inputs.cadence }}
          BOOTSTRAP_CADENCE: ${{ vars.TSE_MONITOR_CADENCE }}
          HAS_DIVERGENCE: ${{ steps.context.outputs.has_divergence }}
          HAS_PENDING_OFFICIAL_STATUS: ${{ steps.context.outputs.has_pending_official_status }}
          STATE_TITLE: Estado automático do monitor TSE
        run: |
          set -euo pipefail
          state_file="$RUNNER_TEMP/tse-monitor-state.json"
          body_file="$RUNNER_TEMP/tse-monitor-state.md"
          issues_json="$(gh issue list --state all --search "$STATE_TITLE in:title" --limit 100 --json number,title,state,author)"
          issue_record="$(ISSUES_JSON="$issues_json" STATE_TITLE="$STATE_TITLE" node -e '
            const issues = JSON.parse(process.env.ISSUES_JSON);
            const issue = issues.find((item) => item.title === process.env.STATE_TITLE && item.author?.login === "github-actions[bot]");
            if (issue) process.stdout.write(JSON.stringify(issue));
          ')"

          if [[ -z "$issue_record" ]]; then
            case "${BOOTSTRAP_CADENCE:-hourly}" in
              hourly|daily|weekly) initial_cadence="${BOOTSTRAP_CADENCE:-hourly}" ;;
              *) initial_cadence="hourly" ;;
            esac
            node .github/scripts/tse-monitor-state.mjs initial --cadence "$initial_cadence" > "$state_file"
            node .github/scripts/tse-monitor-state.mjs render --state "$state_file" > "$body_file"
            issue_url="$(gh issue create --title "$STATE_TITLE" --body-file "$body_file")"
            issue_number="${issue_url##*/}"
          else
            issue_number="$(ISSUE_RECORD="$issue_record" node -e 'process.stdout.write(String(JSON.parse(process.env.ISSUE_RECORD).number))')"
            issue_state="$(ISSUE_RECORD="$issue_record" node -e 'process.stdout.write(JSON.parse(process.env.ISSUE_RECORD).state)')"
            if [[ "$issue_state" == "CLOSED" ]]; then gh issue reopen "$issue_number"; fi
            gh issue view "$issue_number" --json body --jq .body > "$body_file"
            node .github/scripts/tse-monitor-state.mjs extract < "$body_file" > "$state_file"
          fi

          node .github/scripts/tse-monitor-state.mjs gate \
            --state "$state_file" \
            --event "$EVENT_NAME" \
            --schedule "${SCHEDULE:-manual}" \
            --manual-cadence "${MANUAL_CADENCE:-automatic}" \
            --has-divergence "$HAS_DIVERGENCE" \
            --has-pending-official-status "$HAS_PENDING_OFFICIAL_STATUS" >> "$GITHUB_OUTPUT"
          echo "state_file=$state_file" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Registrar agenda inativa
        if: steps.state.outputs.run != 'true'
        env:
          CADENCE: ${{ steps.state.outputs.effective_cadence }}
          SCHEDULE: ${{ github.event.schedule }}
        run: echo "Agenda $SCHEDULE ignorada; cadência auditada atual é $CADENCE." >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar Node.js
        if: steps.state.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Instalar dependências reproduzíveis
        if: steps.state.outputs.run == 'true'
        run: npm ci --ignore-scripts

      - name: Registrar cadência efetiva
        if: steps.state.outputs.run == 'true'
        env:
          CADENCE: ${{ steps.state.outputs.effective_cadence }}
        run: |
          echo "Cadência selecionada automaticamente: $CADENCE" >> "$GITHUB_STEP_SUMMARY"

      - name: Validar o snapshot publicado antes da consulta
        if: steps.state.outputs.run == 'true'
        run: |
          set -euo pipefail
          node scripts/data/validate.mjs
          node scripts/data/build-snapshot.mjs --check

      - name: Consultar fontes oficiais sem alterar conteúdo editorial
        if: steps.state.outputs.run == 'true'
        id: changes
        env:
          TSE_MONITOR_CADENCE: ${{ steps.state.outputs.effective_cadence }}
        run: |
          set -uo pipefail
          output="$(node scripts/tse/sync-metadata.mjs --check 2>&1)"
          exit_code=$?
          set -e
          case "$exit_code" in
            0)
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Nenhuma alteração oficial detectada." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "## Alteração oficial detectada" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              printf '%s\n' "$output" >&2
              exit "$exit_code"
              ;;
          esac

      - name: Persistir estado e registrar transições
        if: steps.state.outputs.run == 'true'
        id: transition
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.state.outputs.issue_number }}
          STATE_FILE: ${{ steps.state.outputs.state_file }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          HAS_DIVERGENCE: ${{ steps.context.outputs.has_divergence }}
          HAS_PENDING_OFFICIAL_STATUS: ${{ steps.context.outputs.has_pending_official_status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          transition_file="$RUNNER_TEMP/tse-monitor-transition.json"
          body_file="$RUNNER_TEMP/tse-monitor-state-next.md"
          comment_file="$RUNNER_TEMP/tse-monitor-transition.md"
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node .github/scripts/tse-monitor-state.mjs transition \
            --state "$STATE_FILE" --changed "$CHANGED" --now "$now" \
            --has-divergence "$HAS_DIVERGENCE" \
            --has-pending-official-status "$HAS_PENDING_OFFICIAL_STATUS" > "$transition_file"
          node .github/scripts/tse-monitor-state.mjs render --state "$transition_file" > "$body_file"
          gh issue edit "$ISSUE_NUMBER" --body-file "$body_file"
          node .github/scripts/tse-monitor-state.mjs emit-transition \
            --state "$transition_file" >> "$GITHUB_OUTPUT"
          should_comment="$(node -e 'const t=require(process.argv[1]); process.stdout.write(String(t.shouldComment))' "$transition_file")"
          if [[ "$should_comment" == "true" ]]; then
            node .github/scripts/tse-monitor-state.mjs comment \
              --state "$transition_file" --run-url "$RUN_URL" > "$comment_file"
            gh issue comment "$ISSUE_NUMBER" --body-file "$comment_file"
          fi

      - name: Espelhar cadência em variável do repositório
        if: steps.state.outputs.run == 'true'
        env:
          VARIABLE_TOKEN: ${{ secrets.TSE_MONITOR_VARIABLE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CADENCE: ${{ steps.transition.outputs.cadence }}
        run: |
          set -euo pipefail
          if [[ -z "${VARIABLE_TOKEN:-}" ]]; then
            echo "Espelho TSE_MONITOR_CADENCE não configurado; a issue permanece como fonte de verdade." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export GH_TOKEN="$VARIABLE_TOKEN"
          gh variable set TSE_MONITOR_CADENCE --body "$CADENCE"

      - name: Abrir alerta editorial sem expor dados brutos
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CADENCE: ${{ steps.transition.outputs.cadence }}
        run: |
          set -euo pipefail
          title="Monitoramento TSE detectou alteração oficial"
          alerts_json="$(gh issue list --state open --search "$title in:title" --limit 100 --json number,title,author)"
          existing="$(ALERTS_JSON="$alerts_json" ALERT_TITLE="$title" node -e '
            const issues = JSON.parse(process.env.ALERTS_JSON);
            const issue = issues.find((item) => item.title === process.env.ALERT_TITLE && item.author?.login === "github-actions[bot]");
            if (issue) process.stdout.write(String(issue.number));
          ')"
          if [[ -n "$existing" ]]; then
            echo "O alerta #$existing já está aberto; nenhuma duplicata foi criada." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          body="$(printf '%s\n\n%s\n%s\n\n%s\n' \
            'O monitoramento automatizado detectou diferença nas fontes oficiais do TSE.' \
            "Cadência redefinida: $CADENCE" \
            "Execução: $RUN_URL" \
            'Revisar a conciliação, marcar candidaturas afetadas como source_changed e recodificar antes de publicar. Não cole CPF, título eleitoral nem outros dados pessoais nesta issue.')"
          gh issue create --title "$title" --body "$body"

      - name: Falhar de forma visível até a revisão editorial
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "Uma alteração oficial exige conciliação e revisão humana antes da publicação." >&2
          exit 1
